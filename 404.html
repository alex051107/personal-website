<html lang="en">

  <style>
    :root { color-scheme: light; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #101722; background: #e9edf2; }
    main { width: min(760px, calc(100% - 2rem)); padding: 3rem; border: 1px solid rgba(23, 34, 49, .72); background: #f7f9fc; }
    p:first-child { margin: 0; font: 700 .75rem/1 ui-monospace, monospace; text-transform: uppercase; }
    h1 { margin: 1.25rem 0; font-size: clamp(4rem, 14vw, 8rem); line-height: .8; letter-spacing: -.08em; }
    a { display: inline-block; padding-bottom: .2rem; border-bottom: 2px solid #155eef; color: inherit; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #155eef; outline-offset: 4px; }
  </style>
</head>

  <main>
    <p>Error / 404</p>
