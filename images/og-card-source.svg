<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Zhenpeng Liu — AI applications and scientific software</title>
  <desc id="description">A natural portrait of Zhenpeng Liu beside a concise description of his portfolio.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect width="1200" height="10" fill="#155eef"/>
  <rect x="696" y="10" width="504" height="620" fill="#dce7f7"/>
  <line x1="696" y1="10" x2="696" y2="630" stroke="#101722" stroke-opacity="0.35"/>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#101722">
    <text x="58" y="68" font-size="22" font-weight="800" letter-spacing="-0.6">Zhenpeng Liu</text>
    <text x="220" y="68" font-size="14" font-weight="700" fill="#155eef">刘振鹏</text>

    <text x="58" y="179" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.2" fill="#155eef">AI APPLICATION ENGINEERING · SCIENTIFIC COMPUTING</text>

    <text x="58" y="252" font-size="67" font-weight="760" letter-spacing="-4.2">
      <tspan x="58" dy="0">I build AI</tspan>
      <tspan x="58" dy="70">applications and</tspan>
      <tspan x="58" dy="70">scientific software.</tspan>
    </text>

    <line x1="58" y1="532" x2="638" y2="532" stroke="#101722" stroke-opacity="0.22"/>
    <text x="58" y="573" font-size="19" fill="#596575">Literature evidence · Backend AI workflows</text>
    <text x="58" y="603" font-size="19" fill="#596575">Molecular simulation · UNC Chapel Hill</text>
  </g>

  <image href="portrait.png" x="696" y="10" width="504" height="620" preserveAspectRatio="xMidYMax meet"/>
  <g transform="translate(1011 578)">
    <rect width="164" height="32" fill="#f8fbff" stroke="#101722" stroke-opacity="0.55"/>
    <text x="82" y="20" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.6" fill="#101722">UNC CHAPEL HILL</text>
  </g>
</svg>
